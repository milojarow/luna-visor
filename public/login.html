<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luna Visor - Login</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <div class="login-container">
    <svg class="login-icon" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="28" fill="#e94560"/>
      <circle cx="42" cy="26" r="22" fill="#1a1a2e"/>
    </svg>
    <h1>Luna Visor</h1>
    <p class="subtitle">Media CDN Manager</p>
    <form id="login-form">
      <input type="password" id="password" placeholder="Password" autofocus required>
      <button type="submit">Enter</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
