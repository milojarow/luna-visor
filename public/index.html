<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luna Visor</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <svg class="app-icon" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="28" fill="#e94560"/>
          <circle cx="42" cy="26" r="22" fill="#1a1a2e"/>
        </svg>
        <h2>Luna Visor</h2>
      </div>
      <button id="btn-all-files" class="sidebar-item active">All Files</button>
      <div id="client-list"></div>
      <div class="sidebar-add-wrap">
        <div class="sidebar-add-row">
          <button id="btn-add-client" class="sidebar-add">+ New Client</button>
          <button id="btn-add-client-caret" class="sidebar-add-caret" aria-label="More client options" aria-haspopup="menu" aria-expanded="false">&#x25B2;</button>
        </div>
        <div id="dropup-add-client" class="dropup-menu" hidden role="menu">
          <button class="dropup-option" id="btn-add-ephemeral-client" role="menuitem">
            <img src="/calendar-clock.svg" alt="" class="dropup-icon">
            <span>Cliente temporal (24h)</span>
          </button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div class="toolbar-left">
          <h3 id="current-view-title">All Files</h3>
        </div>
        <div class="toolbar-center toolbar-gallery">
          <div class="sort-controls">
            <button class="sort-btn active" data-sort="created_at">Date <span class="sort-arrow">&darr;</span></button>
            <button class="sort-btn" data-sort="original_name">Name <span class="sort-arrow"></span></button>
            <button class="sort-btn" data-sort="type">Type <span class="sort-arrow"></span></button>
          </div>
          <button class="group-btn" id="btn-group-date">Group</button>
        </div>
        <div class="toolbar-center toolbar-api-keys" hidden>
          <label class="api-keys-filter-label">
            Filter:
            <select id="api-keys-filter" class="api-keys-filter-select">
              <option value="">All clients</option>
            </select>
          </label>
        </div>
        <div class="toolbar-right">
          <button id="btn-api-keys" class="btn-secondary">API Keys</button>
          <button id="btn-upload" class="btn-primary">Upload</button>
          <button id="btn-logout" class="btn-secondary">Logout</button>
        </div>
      </div>

      <div id="gallery" class="gallery">
        <p class="empty-state">Select a client or upload files to get started.</p>
      </div>

      <div id="api-keys-view" class="api-keys-view" hidden>
        <div id="api-keys-banner" class="api-keys-banner" hidden></div>
        <div id="api-keys-list" class="api-keys-list"></div>
        <button id="btn-new-api-key" class="btn-fab" title="New API Key" aria-label="New API Key">+</button>
      </div>

      <div id="upload-zone" class="upload-zone" hidden>
        <div class="upload-overlay">
          <p>Drop files here or click to select</p>
          <p class="upload-hint">or press <kbd>Ctrl+V</kbd> to paste from clipboard</p>
          <p class="upload-limit">Max file size: 500 MB</p>
          <input type="file" id="file-input" multiple accept="image/*,video/*,.lottie">
          <div id="upload-progress"></div>
          <button id="btn-close-upload" class="btn-secondary">Close</button>
        </div>
      </div>
    </main>
  </div>

  <div id="context-menu" class="context-menu" hidden>
    <ul id="context-menu-items"></ul>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/clipboard.js"></script>
  <script src="/js/context-menu.js"></script>
  <script src="/js/gallery.js"></script>
  <script src="/js/sort.js"></script>
  <script src="/js/selection.js"></script>
  <script src="/js/upload.js"></script>
  <script src="/js/api-keys.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
